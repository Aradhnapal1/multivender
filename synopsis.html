<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Synopsis | Multi-Vendor E-Commerce</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #e9ecef;
            margin: 0;
            padding: 20px;
        }

        .page {
            background: white;
            width: 210mm;
            height: 297mm; /* Standard A4 Size Portrait */
            margin: 0 auto 30px auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 60px 50px;
            box-sizing: border-box;
            page-break-after: always;
            position: relative;
            border-top: 10px solid #198754; /* Green themed border for synopsis */
        }

        .page-number {
            position: absolute;
            bottom: 30px;
            right: 50px;
            font-size: 14px;
            color: #6c757d;
            font-weight: bold;
        }

        .title {
            font-size: 26px;
            color: #212529;
            border-bottom: 3px solid #198754;
            padding-bottom: 10px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .content {
            font-size: 17px;
            line-height: 1.8;
            color: #343a40;
            text-align: justify;
        }

        .content h4 {
            color: #198754;
            font-size: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 1px dashed #ccc;
            padding-bottom: 5px;
            display: inline-block;
        }

        .content ul {
            margin-left: 20px;
            margin-top: 5px;
        }

        .content li {
            margin-bottom: 10px;
        }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #198754;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .print-btn:hover {
            background: #157347;
        }

        /* Print CSS */
        @media print {
            body { background: white; margin: 0; padding: 0; }
            .page { box-shadow: none; margin: 0; border: none; border-top: 10px solid #198754; height: 100vh; }
            .print-btn { display: none; }
            @page { margin: 0; }
        }
    </style>
</head>

<body>

    <button class="print-btn" onclick="window.print()">📄 Download Synopsis PDF</button>

    <div id="pdf-container"></div>

    <script>
        const slides = [
            {
                title: "Synopsis Report",
                content: `<br><br><br><br><h1 style="text-align:center; font-size: 40px; color:#198754; margin-bottom: 5px;">Multi-Vendor E-Commerce Platform</h1>
                          <h3 style="text-align:center; color: #555; margin-top: 0;">Project Synopsis Report</h3>
                          <br><br><br><br>
                          <h4 style="text-align:center; font-size:22px; color:#333; border:none;">Submitted By: [Your Name / Enrollment No.]</h4>
                          <h4 style="text-align:center; font-size:20px; color:#333; border:none;">College: [Your College Name]</h4>`
            },
            {
                title: "Index",
                content: `<br>
                          <table style="width: 100%; border-collapse: collapse; font-size: 18px; border: 2px solid #198754;">
                              <thead>
                                  <tr style="background: #e9ecef; border-bottom: 2px solid #198754;">
                                      <th style="border-right: 2px solid #198754; padding: 10px; width: 15%; text-align: center;">Sr. No.</th>
                                      <th style="border-right: 2px solid #198754; padding: 10px; width: 65%; text-align: left;">Topic / Particulars</th>
                                      <th style="padding: 10px; width: 20%; text-align: center;">Page No.</th>
                                  </tr>
                              </thead>
                              <tbody>
                                  <tr style="border-bottom: 1px solid #ccc;"><td style="border-right: 2px solid #198754; padding: 10px; text-align: center;">1</td><td style="border-right: 2px solid #198754; padding: 10px;">Introduction</td><td style="padding: 10px; text-align: center;">3</td></tr>
                                  <tr style="border-bottom: 1px solid #ccc;"><td style="border-right: 2px solid #198754; padding: 10px; text-align: center;">2</td><td style="border-right: 2px solid #198754; padding: 10px;">Technology Used / Methodology</td><td style="padding: 10px; text-align: center;">4</td></tr>
                                  <tr style="border-bottom: 1px solid #ccc;"><td style="border-right: 2px solid #198754; padding: 10px; text-align: center;">3</td><td style="border-right: 2px solid #198754; padding: 10px;">System Requirements</td><td style="padding: 10px; text-align: center;">5</td></tr>
                                  <tr style="border-bottom: 1px solid #ccc;"><td style="border-right: 2px solid #198754; padding: 10px; text-align: center;">4</td><td style="border-right: 2px solid #198754; padding: 10px;">Future Scope</td><td style="padding: 10px; text-align: center;">6</td></tr>
                                  <tr><td style="border-right: 2px solid #198754; padding: 10px; text-align: center;">5</td><td style="border-right: 2px solid #198754; padding: 10px;">Conclusion</td><td style="padding: 10px; text-align: center;">7</td></tr>
                              </tbody>
                          </table>`
            },
            {
                title: "1. Introduction",
                content: `<p>A <strong>Multi-Vendor E-Commerce Platform</strong> acts as a centralized digital marketplace that facilitates business-to-consumer (B2C) and business-to-business (B2B) transactions. Unlike traditional single-vendor e-commerce websites where only one owner lists and sells products, a multi-vendor ecosystem allows multiple independent sellers (vendors) to register, create their own digital storefronts, manage inventory, and sell products directly to a unified customer base.</p>
                          <p>The platform owner (Superadmin) is responsible for managing the technological infrastructure, verifying vendor authenticity, handling the global product catalog, and ensuring a smooth, secure shopping experience. In return, the platform owner generates revenue by charging a commission on every successful transaction or by offering subscription-based seller plans.</p>
                          <p>This project aims to replicate the highly scalable architecture of industry giants like Amazon, Flipkart, and Etsy. It solves a critical market problem by democratizing e-commerce for small business owners. Local retailers and wholesale manufacturers often lack the technical expertise, budget, and marketing reach required to build and sustain their own standalone e-commerce applications. By joining this platform, they receive a ready-made digital dashboard with zero setup cost, allowing them to focus entirely on sourcing and fulfilling orders.</p>
                          <p>For customers, the platform eliminates the frustration of creating multiple accounts across various disjointed websites. It provides a single, mobile-responsive User Interface with advanced search filters, dynamic cart management, and a unified, secure checkout experience.</p>`
            },
            {
                title: "2. Technology Used / Methodology",
                content: `<p>The project is developed using a highly scalable <strong>N-Tier Client-Server Architecture</strong> (Presentation Layer, Application Layer, Data Layer). The methodology followed during the development lifecycle is the <strong>Agile Methodology</strong>, allowing continuous integration and iterative testing of various modules like User UI, Vendor Dashboard, and Superadmin Panel.</p>
                          <br><h4>Frontend Technologies (Presentation Layer)</h4>
                          <ul>
                              <li><strong>HTML5 & CSS3:</strong> For semantic structure and custom responsive styling.</li>
                              <li><strong>Bootstrap 5:</strong> Utilized for its powerful mobile-first grid system and UI components (Modals, Offcanvas).</li>
                              <li><strong>JavaScript (ES6):</strong> Handles dynamic Document Object Model (DOM) manipulation, form validations, and asynchronous API calls via the Fetch API.</li>
                              <li><strong>Libraries:</strong> SweetAlert2 for interactive user alerts and Swiper.js for touch-enabled product image carousels.</li>
                          </ul>
                          <br><h4>Backend & Database (Application & Data Layer)</h4>
                          <ul>
                              <li><strong>ASP.NET Core Web API (C#):</strong> Acts as the core backend engine processing business logic, routing, and handling HTTP requests statelessly.</li>
                              <li><strong>PostgreSQL:</strong> An advanced, enterprise-class, open-source relational database chosen for its ACID compliance and efficient handling of complex JOIN queries.</li>
                              <li><strong>Entity Framework Core:</strong> The Object-Relational Mapper (ORM) used to manage the database schema and execute secure queries natively through C#.</li>
                              <li><strong>Security:</strong> Implemented using JSON Web Tokens (JWT) for stateless authentication and Role-Based Access Control (RBAC). Passwords are encrypted using robust hashing algorithms.</li>
                          </ul>`
            },
            {
                title: "3. System Requirements",
                content: `<p>To successfully host, develop, and interact with the Multi-Vendor E-Commerce Platform, the following hardware and software requirements must be met by the server and client machines.</p>
                          <br><h4>Hardware Requirements (Server/Developer Machine)</h4>
                          <ul>
                              <li><strong>Processor:</strong> Intel Core i3 (7th Generation or higher) or equivalent AMD Ryzen processor to efficiently handle local server hosting and database compilation.</li>
                              <li><strong>RAM:</strong> Minimum 4 GB of RAM (8 GB or more is highly recommended for running Visual Studio and PostgreSQL server concurrently).</li>
                              <li><strong>Storage:</strong> Minimum 10 GB of free Hard Disk Drive (HDD) or Solid State Drive (SSD) space for project files, database storage, and dependency installations.</li>
                              <li><strong>Network:</strong> A stable broadband internet connection for downloading packages (NuGet/NPM) and testing external APIs like Payment Gateways.</li>
                          </ul>
                          <br><h4>Software Requirements</h4>
                          <ul>
                              <li><strong>Operating System:</strong> Windows 10/11 (64-bit), macOS, or Linux distributions (Ubuntu/Debian).</li>
                              <li><strong>Development Environment:</strong> Microsoft Visual Studio 2022 (for backend C# API) and Visual Studio Code (for Frontend HTML/JS editing).</li>
                              <li><strong>Database Management Tool:</strong> pgAdmin 4 (The official GUI client for managing and monitoring PostgreSQL databases).</li>
                              <li><strong>Framework SDK:</strong> .NET Core 6.0/7.0 SDK installed on the host machine.</li>
                              <li><strong>Client Browser:</strong> Any modern, HTML5-compliant web browser such as Google Chrome, Mozilla Firefox, Apple Safari, or Microsoft Edge.</li>
                          </ul>`
            },
            {
                title: "4. Future Scope",
                content: `<p>While the current iteration of the platform successfully covers all the core end-to-end e-commerce workflows, the system's modular N-Tier architecture makes it highly adaptable for future enhancements and business scaling. Several advanced features can be integrated in the next development phases:</p>
                          <ul>
                              <li><strong>Artificial Intelligence (AI) Recommendations:</strong> Implementing Machine Learning algorithms to track user browsing history and purchase patterns. This would allow the platform to display highly personalized "Suggested Products" and "Frequently Bought Together" sections, significantly increasing the conversion rate.</li>
                              <li><strong>Native Mobile Applications:</strong> Since the backend is built purely on RESTful APIs, developing a dedicated mobile application for Android and iOS using cross-platform frameworks like React Native or Flutter would be seamless, as they can consume the exact same .NET API endpoints used by the web interface.</li>
                              <li><strong>Real-Time Chat Support:</strong> Integrating WebSockets (via Microsoft SignalR) to enable live, real-time chat between Buyers and Vendors. This feature would help resolve customer queries regarding products instantly, reducing return rates.</li>
                              <li><strong>Advanced Data Analytics & Export:</strong> Incorporating deep accounting analysis tools that allow vendors and the Superadmin to track predictive sales trends. Furthermore, adding automated export functionalities (to Excel or CSV formats) for easy tax filing and inventory auditing.</li>
                              <li><strong>Multi-Lingual and Multi-Currency Support:</strong> Expanding the platform globally by adding i18n localization for different languages and integrating live currency conversion APIs.</li>
                          </ul>
                          `
            },
            {
                title: "5. Conclusion",
                content: `<p>In conclusion, the <strong>Multi-Vendor E-Commerce Platform</strong> represents a comprehensive, robust, and highly scalable digital marketplace solution. By leveraging modern, enterprise-grade web technologies—specifically ASP.NET Core for backend processing, PostgreSQL for relational data integrity, and a responsive HTML5/JavaScript frontend—the project effectively solves several critical problems inherent in the traditional e-commerce landscape.</p>
                          <p>The platform successfully bridges the gap between independent, small-scale sellers and a vast, unified customer base. It completely eliminates the financial and technical hurdles that individual vendors face when attempting to build, host, and market their own standalone websites. Instead, vendors are provided with an intuitive dashboard that allows for seamless product uploads, real-time inventory tracking, and transparent revenue monitoring.</p>
                          <p>Furthermore, the strict Role-Based Access Control (RBAC) ensures absolute security. The Superadmin retains total governance over the ecosystem, ensuring that only verified vendors can sell, and maintaining a structured, global category catalog. For the end-user, the platform delivers a flawless, unified shopping experience equipped with advanced filtering, real-time cart manipulation, secure payment processing, and automated PDF invoice generation.</p>
                          <p>Ultimately, this project stands as a complete, production-ready blueprint for a modern digital commerce ecosystem, fully capable of expanding and integrating advanced future technologies.</p>`
            }
        ];

        const container = document.getElementById('pdf-container');
        slides.forEach((slide, index) => {
            const pageDiv = document.createElement('div');
            pageDiv.className = 'page';
            pageDiv.innerHTML = `
                <div class="title">${slide.title}</div>
                <div class="content">${slide.content}</div>
                <div class="page-number">Page ${index + 1} of ${slides.length}</div>
            `;
            container.appendChild(pageDiv);
        });
    </script>
</body>

</html>
